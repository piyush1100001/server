name: Windows Server RDP

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: 'Windows Administrator Password'
        required: true
        default: 'Admin@12345'
      ngrok_token:
        description: 'Optional: Ngrok Auth Token (for public TCP port 3389)'
        required: false
        default: ''
      tailscale_authkey:
        description: 'Optional: Tailscale Auth Key (for direct private VPN RDP)'
        required: false
        default: ''
      session_hours:
        description: 'Session duration in hours (Max 5.8 to avoid GitHub 6h cutoff)'
        required: false
        default: '5.5'

jobs:
  windows-rdp:
    name: Windows Server RDP Runner
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable Windows Remote Desktop & Configure Firewall
        shell: powershell
        run: |
          Write-Host "==> Enabling Windows Remote Desktop in Registry..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          
          Write-Host "==> Enabling Firewall rules for Remote Desktop..."
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          Write-Host "==> Ensuring TermService is running..."
          Start-Service -Name TermService -ErrorAction SilentlyContinue
          Set-Service -Name TermService -StartupType Automatic

      - name: Set Windows Admin Password
        shell: cmd
        run: |
          echo ==> Setting password for runneradmin...
          net user runneradmin ${{ github.event.inputs.rdp_password }}
          net user runneradmin /active:yes

      - name: Setup Sunshine 60 FPS Server & Network Tunnels
        shell: powershell
        run: |
          $Password = "${{ github.event.inputs.rdp_password }}"
          $TS_KEY = "${{ github.event.inputs.tailscale_authkey || secrets.TAILSCALE_AUTHKEY }}"
          $NGROK_TOKEN = "${{ github.event.inputs.ngrok_token }}"

          Write-Host "==> Downloading and installing Sunshine 60 FPS Streaming Server for Windows..."
          Invoke-WebRequest -Uri "https://github.com/LizardByte/Sunshine/releases/latest/download/sunshine-windows-installer.exe" -OutFile "$env:TEMP\sunshine-installer.exe"
          Start-Process -FilePath "$env:TEMP\sunshine-installer.exe" -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 3

          $SunshineExe = "C:\Program Files\Sunshine\sunshine.exe"
          if (Test-Path $SunshineExe) {
            Write-Host "==> Configuring Sunshine settings and credentials..."
            $SunshineConfigDir = "C:\Program Files\Sunshine\config"
            New-Item -ItemType Directory -Force -Path $SunshineConfigDir | Out-Null
            $Conf = @(
              "origin_web_ui_allowed = wan"
              "origin_pin_allowed = wan"
              "csrf_allowed_origins = [""*""]"
              "min_threads = 2"
              "address = 0.0.0.0"
              "port = 47989"
              "web_port = 47990"
            )
            $Conf | Out-File -FilePath "$SunshineConfigDir\sunshine.conf" -Encoding utf8
            
            & $SunshineExe --creds admin $Password
            Start-Process -FilePath $SunshineExe -WindowStyle Hidden
          }

          # Setup Tailscale if key is provided
          if ($TS_KEY -ne "") {
            Write-Host "==> Installing Tailscale for Windows..."
            Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "$env:TEMP\tailscale-setup.exe"
            Start-Process -FilePath "$env:TEMP\tailscale-setup.exe" -ArgumentList "/quiet" -Wait
            
            $TailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"
            if (Test-Path $TailscaleExe) {
              Write-Host "==> Connecting Tailscale mesh network..."
              & $TailscaleExe up --authkey=$TS_KEY --hostname="gha-windows-rdp" --accept-routes
              Start-Sleep -Seconds 5
            }
          }

          # Setup Ngrok if token is provided
          if ($NGROK_TOKEN -ne "") {
            Write-Host "==> Installing Ngrok for Windows..."
            Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "$env:TEMP\ngrok.zip"
            Expand-Archive -Path "$env:TEMP\ngrok.zip" -DestinationPath "C:\Windows\System32" -Force
            ngrok config add-authtoken $NGROK_TOKEN
            Start-Process -FilePath "ngrok" -ArgumentList "tcp 3389 --log=stdout" -RedirectStandardOutput "$env:TEMP\ngrok.log" -NoNewWindow
            Start-Sleep -Seconds 5
          }

      - name: Generate Connection Info & Step Summary
        shell: powershell
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $Password = "${{ github.event.inputs.rdp_password }}"
          $TailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"
          $TS_IP = ""

          if (Test-Path $TailscaleExe) {
            $TS_IP = (& $TailscaleExe ip -4).Trim()
          }

          $NGROK_HOST = ""
          if (Test-Path "$env:TEMP\ngrok.log") {
            $LogContent = Get-Content "$env:TEMP\ngrok.log" -Raw
            if ($LogContent -match "tcp://(?<addr>[^ ]+)") {
              $NGROK_HOST = $Matches['addr']
            }
          }

          $Summary = @(
            "### Windows Server 60 FPS Remote Desktop is LIVE!"
            ""
          )

          if ($TS_IP -ne "") {
            $Summary += "#### 60 FPS Moonlight / Sunshine Streaming (Lowest Latency):"
            $Summary += "1. Open Moonlight App on your Mac/Windows -> Click Add Host (+) -> Enter: ``$TS_IP``"
            $Summary += "2. Moonlight will display a 4-digit PIN."
            $Summary += "3. Open Sunshine Web Dashboard in browser: https://$TS_IP:47990 (Log in with User: ``admin``, Pass: ``$Password``)"
            $Summary += "4. Go to PIN tab in Sunshine -> Enter the 4-digit PIN -> Click Send."
            $Summary += "5. Click Desktop in Moonlight for instant 60 FPS streaming!"
            $Summary += ""
            $Summary += "#### Native Microsoft Remote Desktop:"
            $Summary += "- **PC Name / Address:** ``$TS_IP:3389`` (or ``gha-windows-rdp:3389``)"
            $Summary += ""
          }

          $Summary += "#### System Credentials:"
          $Summary += "- **Username:** ``runneradmin``"
          $Summary += "- **Password:** ``$Password``"
          $Summary += "- **Sunshine Web UI:** https://$TS_IP:47990 (User: ``admin``, Pass: ``$Password``)"
          $Summary += "- **OS:** Windows Server Datacenter"
          $Summary += ""

          if ($NGROK_HOST -ne "") {
            $Summary += "#### Ngrok Public RDP:"
            $Summary += "- **PC Name / Address:** ``$NGROK_HOST``"
            $Summary += ""
          }

          $Summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          Write-Host "========================================================"
          if ($TS_IP -ne "") { Write-Host ">>> MOONLIGHT HOST: $TS_IP" }
          if ($TS_IP -ne "") { Write-Host ">>> SUNSHINE WEB UI: https://$TS_IP:47990" }
          Write-Host ">>> USERNAME: runneradmin"
          Write-Host ">>> PASSWORD: $Password"
          Write-Host "========================================================"

      - name: Keep Windows Runner Alive
        shell: powershell
        run: |
          $Hours = [double]"${{ github.event.inputs.session_hours }}"
          $TotalSeconds = [int]($Hours * 3600)
          
          # Cap at 20800 seconds (~5.77 hours) to prevent abrupt 6h kill
          if ($TotalSeconds -gt 20800) { $TotalSeconds = 20800 }

          Write-Host "==> Windows RDP session running for $Hours hours ($TotalSeconds seconds)."
          Write-Host "==> To terminate early, click 'Cancel workflow' in GitHub Actions."

          $StartTime = Get-Date
          while ($true) {
            $Elapsed = ((Get-Date) - $StartTime).TotalSeconds
            $Remaining = $TotalSeconds - $Elapsed
            
            if ($Remaining -le 0) {
              Write-Host "==> Session time limit reached. Exiting."
              break
            }

            $MinsRemaining = [int]($Remaining / 60)
            Write-Host "[$MinsRemaining min remaining] Windows RDP service is running..."
            Start-Sleep -Seconds 300
          }

      - name: Tailscale Auto-Cleanup & Machine Removal
        if: always()
        shell: powershell
        run: |
          $TailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"
          if (Test-Path $TailscaleExe) {
            Write-Host "==> Automatically logging out and removing runner from Tailscale..."
            & $TailscaleExe logout
          }
