name: Ubuntu 24.04 XFCE Fast Remote Desktop

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: 'VNC & User Password (for login)'
        required: true
        default: 'Admin@12345'
      screen_resolution:
        description: 'Screen Resolution (e.g. 1920x1080, 2560x1440, 1366x768)'
        required: false
        default: '1920x1200'
      ngrok_token:
        description: 'Optional: Ngrok Auth Token (for native TCP RDP port 3389)'
        required: false
        default: ''
      tailscale_authkey:
        description: 'Optional: Tailscale Auth Key (for direct private VPN RDP)'
        required: false
        default: ''
      session_hours:
        description: 'Session duration in hours (Max 5.8 to avoid GitHub 6h hard cutoff)'
        required: false
        default: '5.5'

jobs:
  xfce-rdp:
    name: Ubuntu 24.04 XFCE Runner
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Maximize Disk Space
        run: |
          echo "==> Freeing up runner disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules 2>/dev/null || true
          df -h

      - name: Install XFCE Desktop & Modern Dark Theme
        run: |
          echo "==> Updating package repositories..."
          sudo apt-get update -y
          
          echo "==> Installing lightweight XFCE4, Papirus icons, and dark theme..."
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xfce4 \
            xfce4-terminal \
            xfce4-taskmanager \
            thunar \
            mousepad \
            papirus-icon-theme \
            arc-theme \
            dbus-x11 \
            xvfb \
            x11vnc \
            novnc \
            websockify \
            xrdp \
            xorgxrdp \
            curl \
            wget \
            git \
            htop \
            neofetch \
            pulseaudio \
            pavucontrol

          echo "==> Installing Google Chrome Stable..."
          wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/google-chrome.deb || sudo apt-get install -fy
          rm -f /tmp/google-chrome.deb

      - name: Configure User, XFCE Aesthetics & Performance
        run: |
          USER_PASS="${{ github.event.inputs.vnc_password }}"
          echo "runner:$USER_PASS" | sudo chpasswd
          echo "root:$USER_PASS" | sudo chpasswd
          
          # Setup VNC Password
          mkdir -p ~/.vnc
          x11vnc -storepasswd "$USER_PASS" ~/.vnc/passwd

          # Configure XRDP for XFCE
          echo "export DESKTOP_SESSION=xfce" > ~/.xsession
          echo "export XDG_CURRENT_DESKTOP=XFCE" >> ~/.xsession
          echo "export XDG_SESSION_TYPE=x11" >> ~/.xsession
          echo "exec startxfce4" >> ~/.xsession
          chmod +x ~/.xsession
          sudo cp ~/.xsession /etc/skel/.xsession 2>/dev/null || true
          sudo systemctl restart xrdp 2>/dev/null || true

          # Pre-configure XFCE Performance: Disable all animations, shadows, and compositor
          mkdir -p ~/.config/xfce4/xfconf/xfce-perchannel-xml/
          cat << 'EOF' > ~/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xsettings" version="1.0">
            <property name="Net" type="empty">
              <property name="ThemeName" type="string" value="Arc-Dark"/>
              <property name="IconThemeName" type="string" value="Papirus-Dark"/>
              <property name="EnableEventSounds" type="bool" value="false"/>
              <property name="EnableInputFeedbackSounds" type="bool" value="false"/>
            </property>
          </channel>
          EOF
          sed -i 's/^[ \t]*//' ~/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml

          cat << 'EOF' > ~/.config/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfwm4" version="1.0">
            <property name="general" type="empty">
              <property name="theme" type="string" value="Arc-Dark"/>
              <property name="use_compositing" type="bool" value="false"/>
              <property name="box_move" type="bool" value="true"/>
              <property name="box_resize" type="bool" value="true"/>
              <property name="show_dock_shadow" type="bool" value="false"/>
              <property name="show_frame_shadow" type="bool" value="false"/>
              <property name="show_popup_shadow" type="bool" value="false"/>
            </property>
          </channel>
          EOF
          sed -i 's/^[ \t]*//' ~/.config/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml

          # Create Desktop shortcut for Google Chrome
          mkdir -p ~/Desktop
          if [ -f /usr/share/applications/google-chrome.desktop ]; then
            cp /usr/share/applications/google-chrome.desktop ~/Desktop/
            chmod +x ~/Desktop/google-chrome.desktop
          fi

      - name: Install Sunshine Server & Remote Streaming Tools
        run: |
          echo "==> Downloading and installing Sunshine 60 FPS streaming server for Ubuntu 24.04..."
          wget -q -O /tmp/sunshine.deb https://github.com/LizardByte/Sunshine/releases/latest/download/sunshine-ubuntu-24.04-amd64.deb
          sudo apt-get install -y /tmp/sunshine.deb || sudo apt-get install -fy
          rm -f /tmp/sunshine.deb

          echo "==> Installing Cloudflared..."
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb
          rm /tmp/cloudflared.deb

          # If Ngrok token provided, install ngrok
          if [ -n "${{ github.event.inputs.ngrok_token }}" ]; then
            echo "==> Installing Ngrok..."
            curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
            echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
            sudo apt-get update -y && sudo apt-get install -y ngrok
            ngrok config add-authtoken "${{ github.event.inputs.ngrok_token }}"
          fi

          # If Tailscale key provided (via input or repo secret), install and connect
          TS_KEY="${{ github.event.inputs.tailscale_authkey || secrets.TAILSCALE_AUTHKEY }}"
          if [ -n "$TS_KEY" ]; then
            echo "==> Installing Tailscale..."
            curl -fsSL https://tailscale.com/install.sh | sh
            sudo tailscale up --authkey="$TS_KEY" --hostname="gha-ubuntu-xfce" --accept-routes
          fi

      - name: Start XFCE Desktop, Sunshine 60 FPS & Remote Services
        run: |
          PASS="${{ github.event.inputs.vnc_password }}"
          RES="${{ github.event.inputs.screen_resolution }}"
          
          echo "==> Launching optimized Xvfb virtual display on :1 with resolution $RES..."
          Xvfb :1 -screen 0 ${RES}x24 +extension GLX +extension MIT-SHM +extension RANDR +render -noreset &
          export DISPLAY=:1
          sleep 1

          # Start PulseAudio dummy sink for crystal-clear Moonlight audio
          pulseaudio --start 2>/dev/null || true
          pactl load-module module-null-sink sink_name=dummy 2>/dev/null || true

          echo "==> Launching XFCE session..."
          startxfce4 > /tmp/xfce.log 2>&1 &
          sleep 2

          echo "==> Starting ultra-low latency x11vnc server on port 5900..."
          x11vnc -display :1 -rfbauth ~/.vnc/passwd -rfbport 5900 -shared -forever -bg \
            -wait 5 \
            -defer 5 \
            -noxdamage \
            -nowf \
            -cursor arrow \
            -speeds 100mbps \
            -o /tmp/x11vnc.log

          echo "==> Starting noVNC / WebSockify on port 6080..."
          /usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 > /tmp/novnc.log 2>&1 &
          sleep 2

          echo "==> Configuring & Launching Sunshine 60 FPS Server..."
          # Grant full write access to Linux uinput device for mouse, keyboard, and gamepad emulation
          sudo modprobe uinput 2>/dev/null || true
          sudo chmod 0666 /dev/uinput 2>/dev/null || true
          sudo usermod -aG input runner 2>/dev/null || true
          sudo setfacl -m u:runner:rw /dev/uinput 2>/dev/null || true

          TS_IP=$(tailscale ip -4 2>/dev/null || true)
          mkdir -p ~/.config/sunshine
          
          # Set Sunshine Web UI credentials first
          sunshine --creds admin "$PASS" 2>/dev/null || true

          # Write clean Sunshine configuration with raw comma-separated allowed origins (no JSON brackets)
          cat << EOF > ~/.config/sunshine/sunshine.conf
          origin_web_ui_allowed = wan,lan,pc
          origin_pin_allowed = wan,lan,pc
          csrf_allowed_origins = https://${TS_IP}:47990,http://${TS_IP}:47990,https://localhost:47990,http://localhost:47990,https://127.0.0.1:47990,https://gha-ubuntu-xfce:47990
          min_threads = 2
          encoder = software
          address = 0.0.0.0
          port = 47989
          web_port = 47990
          EOF
          sed -i 's/^[ \t]*//' ~/.config/sunshine/sunshine.conf

          # Start Sunshine background daemon with X11 display context
          DISPLAY=:1 sunshine ~/.config/sunshine/sunshine.conf > /tmp/sunshine.log 2>&1 &
          sleep 3

      - name: Launch Cloudflare Quick Tunnel & Extract Access Link
        run: |
          echo "==> Starting Cloudflare Quick Tunnel for Web noVNC..."
          cloudflared tunnel --url http://localhost:6080 > /tmp/cloudflared.log 2>&1 &
          
          # Wait for tunnel URL to generate
          echo "Waiting for Cloudflare Tunnel URL..."
          CF_URL=""
          for i in {1..30}; do
            CF_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]*\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
            if [ -n "$CF_URL" ]; then
              break
            fi
            sleep 2
          done

          # Start Ngrok TCP if token was provided
          NGROK_HOST=""
          if [ -n "${{ github.event.inputs.ngrok_token }}" ]; then
            ngrok tcp 3389 --log=stdout > /tmp/ngrok.log 2>&1 &
            sleep 3
            NGROK_HOST=$(grep -o 'tcp://[-a-zA-Z0-9.:]*' /tmp/ngrok.log | head -n 1 || true)
          fi

          PASS="${{ github.event.inputs.vnc_password }}"
          TS_IP=""
          if command -v tailscale >/dev/null 2>&1 && tailscale ip -4 >/dev/null 2>&1; then
            TS_IP=$(tailscale ip -4 || true)
          fi

          OPTIMIZED_WEB_URL="${CF_URL}/vnc.html?autoconnect=true&resize=scale&quality=6&compression=2"

          # Output connection details to GitHub Step Summary
          echo "### 🚀 Ubuntu 24.04 60 FPS Remote Desktop is LIVE!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "$TS_IP" ]; then
            echo "#### 🌙 60 FPS Moonlight / Sunshine Streaming (Lowest Latency):" >> $GITHUB_STEP_SUMMARY
            echo "1. **Open Moonlight App** on your Mac/Windows/iPad -> Click **Add Host (+)** -> Enter: \`${TS_IP}\`" >> $GITHUB_STEP_SUMMARY
            echo "2. Moonlight will give you a **4-digit PIN**." >> $GITHUB_STEP_SUMMARY
            echo "3. Open Sunshine Web Dashboard in browser: **[https://${TS_IP}:47990](https://${TS_IP}:47990)** (Log in with User: \`admin\`, Pass: \`${PASS}\`)" >> $GITHUB_STEP_SUMMARY
            echo "4. Go to **PIN** tab in Sunshine -> Enter the 4-digit PIN -> Click **Send**." >> $GITHUB_STEP_SUMMARY
            echo "5. Click **Desktop** in Moonlight for instant **60 FPS audio & video**!" >> $GITHUB_STEP_SUMMARY
            echo "6. 💡 **Touchpad / Mouse Control:** Press \`Ctrl+Alt+Shift+C\` (or \`Cmd+Option+Shift+C\` on Mac) to capture/release mouse pointer in Moonlight." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "#### 🌐 1-Click Fast Web Browser Access:" >> $GITHUB_STEP_SUMMARY
          if [ -n "$CF_URL" ]; then
            echo "- **👉 [Click Here to Open Desktop in Browser](${OPTIMIZED_WEB_URL})**" >> $GITHUB_STEP_SUMMARY
            echo "- **Password:** \`${PASS}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- *Tunnel generation in progress, check raw logs below.*" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "#### 💻 Credentials & Access:" >> $GITHUB_STEP_SUMMARY
          echo "- **Sunshine Web UI:** \`https://${TS_IP}:47990\` (User: \`admin\`, Pass: \`${PASS}\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **System User:** \`runner\` (Pass: \`${PASS}\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Native Microsoft RDP (XRDP):** \`${TS_IP}:3389\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "========================================================"
          if [ -n "$TS_IP" ]; then echo ">>> MOONLIGHT HOST: ${TS_IP}"; fi
          if [ -n "$TS_IP" ]; then echo ">>> SUNSHINE WEB UI: https://${TS_IP}:47990"; fi
          echo ">>> 1-CLICK WEB LINK: ${OPTIMIZED_WEB_URL}"
          echo ">>> PASSWORD: ${PASS}"
          echo "========================================================"

      - name: Keep Runner Alive
        run: |
          HOURS="${{ github.event.inputs.session_hours }}"
          SECONDS_TOTAL=$(awk "BEGIN {print int($HOURS * 3600)}")
          
          # Cap at 20800 seconds (5.77 hours) to ensure clean shutdown before 6h limit
          if [ $SECONDS_TOTAL -gt 20800 ]; then
            SECONDS_TOTAL=20800
          fi

          echo "==> Session active for $HOURS hours ($SECONDS_TOTAL seconds)."
          echo "==> You can now access your XFCE desktop!"
          echo "==> To terminate early, click 'Cancel workflow' in GitHub Actions."

          START_TIME=$(date +%s)
          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            REMAINING=$((SECONDS_TOTAL - ELAPSED))
            
            if [ $REMAINING -le 0 ]; then
              echo "==> Time limit reached. Shutting down gracefully."
              break
            fi

            MINS_LEFT=$((REMAINING / 60))
            echo "[$MINS_LEFT min remaining] Desktop session is running..."
            sleep 300
          done

      - name: Tailscale Auto-Cleanup & Machine Removal
        if: always()
        run: |
          if command -v tailscale >/dev/null 2>&1; then
            echo "==> Automatically logging out and removing runner from Tailscale..."
            sudo tailscale logout || true
          fi
