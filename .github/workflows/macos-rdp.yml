name: macOS Remote Desktop

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: 'macOS & VNC Password'
        required: true
        default: 'Admin@12345'
      tailscale_authkey:
        description: 'Optional: Tailscale Auth Key (for direct Apple Screen Sharing)'
        required: false
        default: ''
      ngrok_token:
        description: 'Optional: Ngrok Auth Token (for public TCP port 5900)'
        required: false
        default: ''
      session_hours:
        description: 'Session duration in hours (Max 5.8 to avoid GitHub 6h cutoff)'
        required: false
        default: '5.5'

jobs:
  macos-rdp:
    name: macOS Apple Silicon Runner
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Configure macOS User Credentials & Privileges
        run: |
          PASS="${{ github.event.inputs.vnc_password }}"
          echo "==> Configuring runner credentials..."
          
          # Set runner user password across DirectoryService and system
          sudo dscl . -passwd /Users/runner "" "$PASS" 2>/dev/null || true
          echo -e "${PASS}\n${PASS}" | sudo passwd runner 2>/dev/null || true
          sudo sysadminctl -resetPasswordFor runner -newPassword "$PASS" 2>/dev/null || true

      - name: Enable Apple Screen Sharing (VNC / ARD) & Permissions
        run: |
          PASS="${{ github.event.inputs.vnc_password }}"
          echo "==> Enabling Apple Remote Desktop & Screen Sharing..."
          
          # Grant Screen Recording and Accessibility permissions in TCC database
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.apple.RemoteDesktopAgent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1665555555);" 2>/dev/null || true
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.apple.screensharing.agent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1665555555);" 2>/dev/null || true
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','com.apple.RemoteDesktopAgent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1665555555);" 2>/dev/null || true

          # Authorize runner user in Screen Sharing Directory Group
          sudo dseditgroup -o create com.apple.access_screensharing 2>/dev/null || true
          sudo dseditgroup -o edit -a runner -t user com.apple.access_screensharing 2>/dev/null || true
          sudo dseditgroup -o edit -a admin -t group com.apple.access_screensharing 2>/dev/null || true
          sudo dseditgroup -o edit -a staff -t group com.apple.access_screensharing 2>/dev/null || true

          # Enable launch daemon overrides & remote management preferences
          sudo defaults write /var/db/launchd.db/com.apple.launchd/overrides.plist com.apple.screensharing -dict Disabled -bool false
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement.plist VNCOpenToAll -bool true
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement.plist VNCAlwaysNotifyOnDemand -bool false
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement.plist VNCGuestAccess -bool true
          
          # Configure Kickstart permissions, legacy VNC client access, and password
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate \
            -configure -allowAccessFor -allUsers -privs -all \
            -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$PASS" \
            -restart -agent -console || true

          # Force start screensharing service
          sudo launchctl enable system/com.apple.screensharing 2>/dev/null || true
          sudo launchctl kickstart -kp system/com.apple.screensharing 2>/dev/null || true

      - name: Setup Web Access & Network Tunnels
        run: |
          TS_KEY="${{ github.event.inputs.tailscale_authkey || secrets.TAILSCALE_AUTHKEY }}"
          NGROK_TOKEN="${{ github.event.inputs.ngrok_token }}"

          echo "==> Installing WebSockify and Cloudflared for 1-Click Browser Access..."
          brew install websockify cloudflare/cloudflare/cloudflared 2>/dev/null || true

          # Clone lightweight noVNC client
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc 2>/dev/null || true
          
          # Start websockify proxy on port 6080 -> macOS Apple Screen Sharing (5900)
          websockify --web /tmp/novnc 6080 localhost:5900 > /tmp/websockify.log 2>&1 &
          sleep 2

          # Start Cloudflare Quick Tunnel for Web access
          cloudflared tunnel --url http://localhost:6080 > /tmp/cloudflared.log 2>&1 &

          # Setup Tailscale via Homebrew CLI
          if [ -n "$TS_KEY" ]; then
            echo "==> Installing Tailscale for macOS via Homebrew..."
            brew install tailscale
            echo "==> Starting Tailscale daemon..."
            sudo brew services start tailscale
            sleep 4
            sudo tailscale up --authkey="$TS_KEY" --hostname="gha-macos-rdp" --accept-routes
          fi

          # Setup Ngrok (forward port 5900)
          if [ -n "$NGROK_TOKEN" ]; then
            echo "==> Installing Ngrok for macOS..."
            brew install ngrok/ngrok/ngrok 2>/dev/null || true
            ngrok config add-authtoken "$NGROK_TOKEN"
            ngrok tcp 5900 --log=stdout > /tmp/ngrok.log 2>&1 &
            sleep 3
          fi

      - name: Generate Connection Info & Step Summary
        run: |
          PASS="${{ github.event.inputs.vnc_password }}"
          
          # Extract Cloudflare URL if available
          CF_URL=""
          for i in {1..25}; do
            if [ -f /tmp/cloudflared.log ]; then
              CF_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]*\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
              if [ -n "$CF_URL" ]; then break; fi
            fi
            sleep 1
          done

          TS_IP=""
          if command -v tailscale >/dev/null 2>&1 && tailscale ip -4 >/dev/null 2>&1; then
            TS_IP=$(tailscale ip -4 || true)
          fi

          NGROK_HOST=""
          if [ -f /tmp/ngrok.log ]; then
            NGROK_HOST=$(grep -o 'tcp://[-a-zA-Z0-9.:]*' /tmp/ngrok.log | head -n 1 || true)
          fi

          OS_VERSION=$(sw_vers -productVersion)
          OS_NAME=$(sw_vers -productName)
          OPTIMIZED_WEB_URL="${CF_URL}/vnc.html?autoconnect=true&resize=scale&quality=6"

          echo "### 🍎 macOS Apple Silicon Desktop is LIVE!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "$CF_URL" ]; then
            echo "#### 🌐 1-Click Fast Web Browser Access (Zero Setup):" >> $GITHUB_STEP_SUMMARY
            echo "- **👉 [Click Here to Open macOS in Browser](${OPTIMIZED_WEB_URL})**" >> $GITHUB_STEP_SUMMARY
            echo "- **Password:** \`${PASS}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "#### 💻 System & Credentials:" >> $GITHUB_STEP_SUMMARY
          echo "- **OS:** ${OS_NAME} ${OS_VERSION} (Apple Silicon)" >> $GITHUB_STEP_SUMMARY
          echo "- **Username:** \`runner\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Password:** \`${PASS}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -n "$TS_IP" ]; then
            echo "#### 🍏 Native Apple Screen Sharing via Tailscale:" >> $GITHUB_STEP_SUMMARY
            echo "- **Mac Screen Sharing Address:** \`vnc://${TS_IP}:5900\` (or \`vnc://gha-macos-rdp:5900\`)" >> $GITHUB_STEP_SUMMARY
            echo "- **How to connect:** Open Terminal on your Mac and run: \`open vnc://${TS_IP}:5900\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Auth Option 1 (Registered User):** Username: \`runner\`, Password: \`${PASS}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Auth Option 2 (VNC Password):** Select 'With a VNC password' and enter: \`${PASS}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$NGROK_HOST" ]; then
            echo "#### 🔌 Ngrok Public VNC:" >> $GITHUB_STEP_SUMMARY
            echo "- **VNC Address:** \`${NGROK_HOST#tcp://}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "========================================================"
          if [ -n "$CF_URL" ]; then echo ">>> 1-CLICK WEB DESKTOP: ${OPTIMIZED_WEB_URL}"; fi
          echo ">>> USERNAME: runner"
          echo ">>> PASSWORD: ${PASS}"
          if [ -n "$TS_IP" ]; then echo ">>> NATIVE SCREEN SHARING: vnc://${TS_IP}:5900"; fi
          if [ -n "$NGROK_HOST" ]; then echo ">>> NGROK VNC: ${NGROK_HOST#tcp://}"; fi
          echo "========================================================"

      - name: Keep macOS Runner Alive
        run: |
          HOURS="${{ github.event.inputs.session_hours }}"
          SECONDS_TOTAL=$(awk "BEGIN {print int($HOURS * 3600)}")
          
          if [ $SECONDS_TOTAL -gt 20800 ]; then
            SECONDS_TOTAL=20800
          fi

          echo "==> macOS session active for $HOURS hours ($SECONDS_TOTAL seconds)."
          echo "==> To terminate early, click 'Cancel workflow' in GitHub Actions."

          START_TIME=$(date +%s)
          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            REMAINING=$((SECONDS_TOTAL - ELAPSED))
            
            if [ $REMAINING -le 0 ]; then
              echo "==> Time limit reached. Shutting down gracefully."
              break
            fi

            MINS_LEFT=$((REMAINING / 60))
            echo "[$MINS_LEFT min remaining] macOS session is running..."
            sleep 300
          done

      - name: Tailscale Auto-Cleanup & Machine Removal
        if: always()
        run: |
          if command -v tailscale >/dev/null 2>&1; then
            echo "==> Automatically logging out and removing macOS runner from Tailscale..."
            sudo tailscale logout || true
          fi
