name: macOS Remote Desktop (RustDesk & Web)

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: 'Password for RustDesk & Web Access'
        required: true
        default: 'Admin@12345'
      tailscale_authkey:
        description: 'Optional: Tailscale Auth Key (for direct private VPN mesh)'
        required: false
        default: ''
      session_hours:
        description: 'Session duration in hours (Max 5.8 to avoid GitHub 6h cutoff)'
        required: false
        default: '5.5'

jobs:
  macos-rdp:
    name: macOS Apple Silicon Runner (RustDesk)
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Install RustDesk & Grant macOS System Permissions
        run: |
          PASS="${{ github.event.inputs.rdp_password }}"
          echo "==> Resolving latest RustDesk Apple Silicon release..."
          
          DMG_URL=""
          try_count=0
          while [ -z "$DMG_URL" ] && [ $try_count -lt 5 ]; do
            DMG_URL=$(curl -fsSL https://api.github.com/repos/rustdesk/rustdesk/releases/latest | grep -o 'https://[^"]*aarch64\.dmg' | head -n 1 || true)
            if [ -z "$DMG_URL" ]; then
              DMG_URL=$(curl -fsSL https://api.github.com/repos/rustdesk/rustdesk/releases/latest | grep -o 'https://[^"]*arm64\.dmg' | head -n 1 || true)
            fi
            try_count=$((try_count + 1))
            sleep 1
          done

          if [ -z "$DMG_URL" ]; then
            DMG_URL="https://github.com/rustdesk/rustdesk/releases/download/1.4.5/rustdesk-1.4.5-aarch64.dmg"
          fi

          echo "==> Downloading RustDesk from: $DMG_URL"
          curl -fsSL -L "$DMG_URL" -o /tmp/rustdesk.dmg

          echo "==> Installing RustDesk.app to /Applications..."
          hdiutil attach /tmp/rustdesk.dmg -mountpoint /Volumes/RustDesk -nobrowse -quiet
          sudo cp -R /Volumes/RustDesk/RustDesk.app /Applications/
          hdiutil detach /Volumes/RustDesk -quiet || true
          rm -f /tmp/rustdesk.dmg

          # Grant full Accessibility, Screen Recording, and Input Monitoring permissions in TCC database
          echo "==> Injecting macOS TCC Privacy Permissions..."
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.carriez.RustDesk',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1665555555);" 2>/dev/null || true
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','com.carriez.RustDesk',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1665555555);" 2>/dev/null || true
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access VALUES('kTCCServicePostEvent','com.carriez.RustDesk',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1665555555);" 2>/dev/null || true

      - name: Configure RustDesk & Launch Service
        run: |
          PASS="${{ github.event.inputs.rdp_password }}"
          RUSTDESK_BIN="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo "==> Setting static access password..."
          sudo "$RUSTDESK_BIN" --password "$PASS" 2>/dev/null || true

          echo "==> Starting RustDesk background service..."
          sudo "$RUSTDESK_BIN" --service > /tmp/rustdesk.log 2>&1 &
          open -a /Applications/RustDesk.app
          sleep 5

          echo "==> Retrieving 9-digit RustDesk ID..."
          RUSTDESK_ID=""
          for i in {1..20}; do
            RUSTDESK_ID=$("$RUSTDESK_BIN" --get-id 2>/dev/null | tr -d ' ' | grep -E '^[0-9]+$' | head -n 1 || true)
            if [ -n "$RUSTDESK_ID" ]; then break; fi
            sleep 1
          done

          echo "RUSTDESK_ID=$RUSTDESK_ID" >> $GITHUB_ENV
          echo "==> Active RustDesk ID: $RUSTDESK_ID"

      - name: Setup Optional Tailscale Network Mesh
        run: |
          TS_KEY="${{ github.event.inputs.tailscale_authkey || secrets.TAILSCALE_AUTHKEY }}"
          if [ -n "$TS_KEY" ]; then
            echo "==> Installing Tailscale for macOS via Homebrew..."
            brew install tailscale
            echo "==> Starting Tailscale daemon..."
            sudo brew services start tailscale
            sleep 4
            sudo tailscale up --authkey="$TS_KEY" --hostname="gha-macos-rdp" --accept-routes || echo "Warning: Tailscale auth failed. Check if key is valid."
          fi

      - name: Generate Connection Info & Step Summary
        run: |
          PASS="${{ github.event.inputs.rdp_password }}"
          RUSTDESK_ID="${{ env.RUSTDESK_ID }}"
          OS_VERSION=$(sw_vers -productVersion)
          OS_NAME=$(sw_vers -productName)

          TS_IP=""
          if command -v tailscale >/dev/null 2>&1 && tailscale ip -4 >/dev/null 2>&1; then
            TS_IP=$(tailscale ip -4 || true)
          fi

          echo "### 🍎 macOS Apple Silicon Desktop is LIVE (RustDesk)!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "#### 🌐 1-Click Fast Web Browser Access (Zero Client Installation):" >> $GITHUB_STEP_SUMMARY
          echo "1. **👉 [Click Here to Open RustDesk Web Client](https://web.rustdesk.com)**" >> $GITHUB_STEP_SUMMARY
          echo "2. Enter Remote Device ID: **\`${RUSTDESK_ID}\`**" >> $GITHUB_STEP_SUMMARY
          echo "3. Enter Password: **\`${PASS}\`**" >> $GITHUB_STEP_SUMMARY
          echo "4. Your **macOS Apple Silicon Desktop** will stream immediately inside your browser!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "#### 📱 Connect via Native RustDesk App (Mac / Windows / iOS / Android):" >> $GITHUB_STEP_SUMMARY
          echo "- **Download Client:** [rustdesk.com](https://rustdesk.com)" >> $GITHUB_STEP_SUMMARY
          echo "- **Remote ID:** \`${RUSTDESK_ID}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Password:** \`${PASS}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "#### 💻 System Information:" >> $GITHUB_STEP_SUMMARY
          echo "- **OS:** ${OS_NAME} ${OS_VERSION} (Apple Silicon)" >> $GITHUB_STEP_SUMMARY
          echo "- **Architecture:** ARM64 (Apple M-Series)" >> $GITHUB_STEP_SUMMARY
          if [ -n "$TS_IP" ]; then echo "- **Tailscale Mesh IP:** \`${TS_IP}\`" >> $GITHUB_STEP_SUMMARY; fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "========================================================"
          echo ">>> RUSTDESK WEB CLIENT: https://web.rustdesk.com"
          echo ">>> RUSTDESK DEVICE ID: ${RUSTDESK_ID}"
          echo ">>> ACCESS PASSWORD: ${PASS}"
          if [ -n "$TS_IP" ]; then echo ">>> TAILSCALE IP: ${TS_IP}"; fi
          echo "========================================================"

      - name: Keep macOS Runner Alive
        run: |
          HOURS="${{ github.event.inputs.session_hours }}"
          SECONDS_TOTAL=$(awk "BEGIN {print int($HOURS * 3600)}")
          
          if [ $SECONDS_TOTAL -gt 20800 ]; then
            SECONDS_TOTAL=20800
          fi

          echo "==> macOS session active for $HOURS hours ($SECONDS_TOTAL seconds)."
          echo "==> To terminate early, click 'Cancel workflow' in GitHub Actions."

          START_TIME=$(date +%s)
          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            REMAINING=$((SECONDS_TOTAL - ELAPSED))
            
            if [ $REMAINING -le 0 ]; then
              echo "==> Time limit reached. Shutting down gracefully."
              break
            fi

            MINS_LEFT=$((REMAINING / 60))
            echo "[$MINS_LEFT min remaining] macOS session is running..."
            sleep 300
          done

      - name: Tailscale Auto-Cleanup & Machine Removal
        if: always()
        run: |
          if command -v tailscale >/dev/null 2>&1; then
            echo "==> Automatically logging out and removing macOS runner from Tailscale..."
            sudo tailscale logout || true
          fi
