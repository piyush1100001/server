name: macOS Remote Desktop

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: 'VNC Password (for Web & App login)'
        required: true
        default: 'Admin@12345'
      screen_resolution:
        description: 'Screen Resolution (e.g. 1920x1080, 1920x1200, 1680x1050)'
        required: false
        default: '1920x1200'
      tailscale_authkey:
        description: 'Optional: Tailscale Auth Key (for direct private VPN VNC)'
        required: false
        default: ''
      ngrok_token:
        description: 'Optional: Ngrok Auth Token (for public TCP port 5901)'
        required: false
        default: ''
      session_hours:
        description: 'Session duration in hours (Max 5.8 to avoid GitHub 6h cutoff)'
        required: false
        default: '5.5'

jobs:
  macos-rdp:
    name: macOS Apple Silicon Runner
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Install Desktop Server & Tunnel Tools
        run: |
          echo "==> Installing TigerVNC, WebSockify, and Cloudflared via Homebrew..."
          brew install tiger-vnc websockify cloudflare/cloudflare/cloudflared 2>/dev/null || true

      - name: Configure VNC Password & Display
        run: |
          PASS="${{ github.event.inputs.vnc_password }}"
          RES="${{ github.event.inputs.screen_resolution }}"
          echo "==> Setting up dedicated VNC authentication file..."
          mkdir -p ~/.vnc
          echo "$PASS" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

          # Create clean startup script
          cat << 'EOF' > ~/.vnc/xstartup
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec /System/Library/CoreServices/Finder.app/Contents/MacOS/Finder &
          EOF
          chmod +x ~/.vnc/xstartup

          echo "==> Launching TigerVNC Server on display :1 (port 5901) with resolution $RES..."
          vncserver -kill :1 2>/dev/null || true
          vncserver :1 -geometry $RES -depth 24 -rfbauth ~/.vnc/passwd

          echo "==> Setting up noVNC Web Client on port 6080..."
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc 2>/dev/null || true
          websockify --web /tmp/novnc 6080 localhost:5901 > /tmp/websockify.log 2>&1 &
          sleep 2

          echo "==> Launching Cloudflare Quick Tunnel for 1-Click Web Access..."
          cloudflared tunnel --url http://localhost:6080 > /tmp/cloudflared.log 2>&1 &

      - name: Setup Network Tunnels (Tailscale & Ngrok)
        run: |
          TS_KEY="${{ github.event.inputs.tailscale_authkey || secrets.TAILSCALE_AUTHKEY }}"
          NGROK_TOKEN="${{ github.event.inputs.ngrok_token }}"

          # Setup Tailscale via Homebrew CLI
          if [ -n "$TS_KEY" ]; then
            echo "==> Installing Tailscale for macOS via Homebrew..."
            brew install tailscale
            echo "==> Starting Tailscale daemon..."
            sudo brew services start tailscale
            sleep 4
            sudo tailscale up --authkey="$TS_KEY" --hostname="gha-macos-rdp" --accept-routes
          fi

          # Setup Ngrok (forward port 5901)
          if [ -n "$NGROK_TOKEN" ]; then
            echo "==> Installing Ngrok for macOS..."
            brew install ngrok/ngrok/ngrok 2>/dev/null || true
            ngrok config add-authtoken "$NGROK_TOKEN"
            ngrok tcp 5901 --log=stdout > /tmp/ngrok.log 2>&1 &
            sleep 3
          fi

      - name: Generate Connection Info & Step Summary
        run: |
          PASS="${{ github.event.inputs.vnc_password }}"
          
          # Wait and extract Cloudflare URL
          CF_URL=""
          for i in {1..25}; do
            if [ -f /tmp/cloudflared.log ]; then
              CF_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]*\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
              if [ -n "$CF_URL" ]; then break; fi
            fi
            sleep 1
          done

          TS_IP=""
          if command -v tailscale >/dev/null 2>&1 && tailscale ip -4 >/dev/null 2>&1; then
            TS_IP=$(tailscale ip -4 || true)
          fi

          NGROK_HOST=""
          if [ -f /tmp/ngrok.log ]; then
            NGROK_HOST=$(grep -o 'tcp://[-a-zA-Z0-9.:]*' /tmp/ngrok.log | head -n 1 || true)
          fi

          OS_VERSION=$(sw_vers -productVersion)
          OS_NAME=$(sw_vers -productName)
          OPTIMIZED_WEB_URL="${CF_URL}/vnc.html?autoconnect=true&resize=scale&quality=6"

          echo "### 🍎 macOS Apple Silicon Desktop is LIVE!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "$CF_URL" ]; then
            echo "#### 🌐 1-Click Fast Web Browser Access (Zero Setup):" >> $GITHUB_STEP_SUMMARY
            echo "- **👉 [Click Here to Open macOS in Browser](${OPTIMIZED_WEB_URL})**" >> $GITHUB_STEP_SUMMARY
            echo "- **Password:** \`${PASS}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "#### 💻 System & Credentials:" >> $GITHUB_STEP_SUMMARY
          echo "- **OS:** ${OS_NAME} ${OS_VERSION} (Apple Silicon)" >> $GITHUB_STEP_SUMMARY
          echo "- **VNC Password:** \`${PASS}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -n "$TS_IP" ]; then
            echo "#### 🍏 Native Screen Sharing / VNC App via Tailscale:" >> $GITHUB_STEP_SUMMARY
            echo "- **Address:** \`vnc://${TS_IP}:5901\` (or \`vnc://gha-macos-rdp:5901\`)" >> $GITHUB_STEP_SUMMARY
            echo "- **Password:** \`${PASS}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$NGROK_HOST" ]; then
            echo "#### 🔌 Ngrok Public VNC:" >> $GITHUB_STEP_SUMMARY
            echo "- **VNC Address:** \`${NGROK_HOST#tcp://}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "========================================================"
          if [ -n "$CF_URL" ]; then echo ">>> 1-CLICK WEB LINK: ${OPTIMIZED_WEB_URL}"; fi
          echo ">>> VNC PASSWORD: ${PASS}"
          if [ -n "$TS_IP" ]; then echo ">>> TAILSCALE VNC: vnc://${TS_IP}:5901"; fi
          if [ -n "$NGROK_HOST" ]; then echo ">>> NGROK VNC: ${NGROK_HOST#tcp://}"; fi
          echo "========================================================"

      - name: Keep macOS Runner Alive
        run: |
          HOURS="${{ github.event.inputs.session_hours }}"
          SECONDS_TOTAL=$(awk "BEGIN {print int($HOURS * 3600)}")
          
          if [ $SECONDS_TOTAL -gt 20800 ]; then
            SECONDS_TOTAL=20800
          fi

          echo "==> macOS session active for $HOURS hours ($SECONDS_TOTAL seconds)."
          echo "==> To terminate early, click 'Cancel workflow' in GitHub Actions."

          START_TIME=$(date +%s)
          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            REMAINING=$((SECONDS_TOTAL - ELAPSED))
            
            if [ $REMAINING -le 0 ]; then
              echo "==> Time limit reached. Shutting down gracefully."
              break
            fi

            MINS_LEFT=$((REMAINING / 60))
            echo "[$MINS_LEFT min remaining] macOS session is running..."
            sleep 300
          done

      - name: Tailscale Auto-Cleanup & Machine Removal
        if: always()
        run: |
          if command -v tailscale >/dev/null 2>&1; then
            echo "==> Automatically logging out and removing macOS runner from Tailscale..."
            sudo tailscale logout || true
          fi
