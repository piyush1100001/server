name: macOS Remote Desktop

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: 'macOS & VNC Password'
        required: true
        default: 'Admin@12345'
      tailscale_authkey:
        description: 'Optional: Tailscale Auth Key (for direct Apple Screen Sharing)'
        required: false
        default: ''
      ngrok_token:
        description: 'Optional: Ngrok Auth Token (for public TCP port 5900)'
        required: false
        default: ''
      session_hours:
        description: 'Session duration in hours (Max 5.8 to avoid GitHub 6h cutoff)'
        required: false
        default: '5.5'

jobs:
  macos-rdp:
    name: macOS Apple Silicon Runner
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Configure Dedicated RDP User & Graphical Auto-Login
        run: |
          PASS="${{ github.event.inputs.vnc_password }}"
          echo "==> Creating dedicated admin user 'rdpuser' in OpenDirectory with authentic PBKDF2 ShadowHash..."
          
          # Delete any old record if present
          sudo dscl . -delete /Users/rdpuser >/dev/null 2>&1 || true
          
          # Create fresh OpenDirectory record
          sudo dscl . -create /Users/rdpuser
          sudo dscl . -create /Users/rdpuser UserShell /bin/zsh
          sudo dscl . -create /Users/rdpuser RealName "Remote Admin"
          sudo dscl . -create /Users/rdpuser UniqueID 550
          sudo dscl . -create /Users/rdpuser PrimaryGroupID 20
          sudo dscl . -create /Users/rdpuser NFSHomeDirectory /Users/rdpuser
          sudo mkdir -p /Users/rdpuser
          sudo chown -R 550:20 /Users/rdpuser

          # Inject authentic Apple PBKDF2 binary ShadowHashData for both users
          python3 -c "
          import plistlib, os, hashlib, binascii, subprocess
          passw = b'${PASS}'
          salt = os.urandom(32)
          entropy = hashlib.pbkdf2_hmac('sha512', passw, salt, 45000)
          shadow = {'SALTED-SHA512-PBKDF2': {'entropy': entropy, 'salt': salt, 'iterations': 45000}}
          hex_data = binascii.hexlify(plistlib.dumps(shadow)).decode()
          for u in ['rdpuser', 'runner']:
              subprocess.run(['sudo', 'dscl', '.', '-create', f'/Users/{u}', 'AuthenticationAuthority', ';ShadowHash;HASHLIST:<SALTED-SHA512-PBKDF2>'], check=False)
              subprocess.run(['sudo', 'dscl', '.', '-create', f'/Users/{u}', 'ShadowHashData', hex_data], check=False)
              subprocess.run(['sudo', 'dscl', '.', '-passwd', f'/Users/{u}', passw.decode()], check=False)
          "

          # Add rdpuser to admin and screensharing groups
          echo y | sudo dseditgroup -o edit -a rdpuser -t user admin 2>/dev/null || true
          echo y | sudo dseditgroup -o edit -a rdpuser -t user com.apple.access_screensharing 2>/dev/null || true

          # Configure macOS graphical Auto-Login into Aqua desktop
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser rdpuser
          sudo python3 -c "
          key = [125, 137, 82, 35, 210, 188, 221, 234, 163, 162, 206, 127]
          pwd = b'${PASS}'
          encoded = bytes([b ^ key[i % len(key)] for i, b in enumerate(pwd)])
          with open('/etc/kcpassword', 'wb') as f:
              f.write(encoded)
          "
          sudo chmod 600 /etc/kcpassword

      - name: Enable Native Apple Screen Sharing & Permissions
        run: |
          PASS="${{ github.event.inputs.vnc_password }}"
          echo "==> Configuring pure Apple Screen Sharing service..."
          
          # Deactivate ARDAgent to eliminate Remote Management vs Screen Sharing conflict
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -deactivate -stop 2>/dev/null || true

          # Grant Screen Recording and Accessibility permissions in TCC database
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.apple.screensharing.agent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1665555555);" 2>/dev/null || true
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.apple.ScreenSharing',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1665555555);" 2>/dev/null || true
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','com.apple.screensharing.agent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1665555555);" 2>/dev/null || true

          # Authorize rdpuser and runner in Screen Sharing Directory Group
          if ! dseditgroup com.apple.access_screensharing >/dev/null 2>&1; then
            echo y | sudo dseditgroup -o create com.apple.access_screensharing 2>/dev/null || true
          fi
          echo y | sudo dseditgroup -o edit -a rdpuser -t user com.apple.access_screensharing 2>/dev/null || true
          echo y | sudo dseditgroup -o edit -a runner -t user com.apple.access_screensharing 2>/dev/null || true
          echo y | sudo dseditgroup -o edit -a admin -t group com.apple.access_screensharing 2>/dev/null || true
          echo y | sudo dseditgroup -o edit -a staff -t group com.apple.access_screensharing 2>/dev/null || true

          # Set valid AuthenticationAuthority and password for runner and rdpuser
          sudo dscl . -create /Users/runner AuthenticationAuthority ';ShadowHash;HASHLIST:<SALTED-SHA512-PBKDF2>' 2>/dev/null || true
          sudo dscl . -passwd /Users/runner "$PASS" 2>/dev/null || true
          sudo dscl . -create /Users/rdpuser AuthenticationAuthority ';ShadowHash;HASHLIST:<SALTED-SHA512-PBKDF2>' 2>/dev/null || true
          sudo dscl . -passwd /Users/rdpuser "$PASS" 2>/dev/null || true

          # Enable pure Screen Sharing launch daemon & preferences
          sudo defaults write /var/db/launchd.db/com.apple.launchd/overrides.plist com.apple.screensharing -dict Disabled -bool false
          sudo defaults write /Library/Preferences/com.apple.preferences.sharing.plist ScreenSharingEnabled -bool true
          sudo defaults write /Library/Preferences/com.apple.preferences.sharing.plist RemoteManagementEnabled -bool false
          sudo defaults write /Library/Preferences/com.apple.ScreenSharing.plist ScreenSharingAllowed -bool true
          sudo defaults write /Library/Preferences/com.apple.ScreenSharing.plist AuthenticateUsers -bool true
          sudo defaults write /Library/Preferences/com.apple.ScreenSharing.plist AutoAcceptUsers -bool true
          sudo defaults write /Library/Preferences/com.apple.ScreenSharing.plist AllowVNCAuth -bool true
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement.plist VNCOpenToAll -bool true
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement.plist VNCGuestAccess -bool true
          sudo defaults write /Library/Preferences/com.apple.VNCSettings.txt DisableLegacyVNC -bool false

          # Configure legacy VNC password so standard VNC password login works cleanly
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$PASS" 2>/dev/null || true
          
          # Force start pure screensharing service
          sudo launchctl load -wF /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          sudo launchctl enable system/com.apple.screensharing 2>/dev/null || true
          sudo launchctl kickstart -k -p system/com.apple.screensharing 2>/dev/null || true

      - name: Setup Web Access & Network Tunnels
        run: |
          TS_KEY="${{ github.event.inputs.tailscale_authkey || secrets.TAILSCALE_AUTHKEY }}"
          NGROK_TOKEN="${{ github.event.inputs.ngrok_token }}"

          echo "==> Installing WebSockify and Cloudflared for 1-Click Browser Access..."
          # Install websockify via pip3
          pip3 install --break-system-packages websockify 2>/dev/null || python3 -m pip install websockify 2>/dev/null || true

          # Download official cloudflared binary for macOS Apple Silicon
          sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64 -o /usr/local/bin/cloudflared 2>/dev/null || true
          sudo chmod +x /usr/local/bin/cloudflared 2>/dev/null || true

          # Clone lightweight noVNC client
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc 2>/dev/null || true
          
          # Start websockify proxy on port 6080 -> macOS Apple Screen Sharing (5900)
          websockify --web /tmp/novnc 6080 localhost:5900 > /tmp/websockify.log 2>&1 &
          sleep 2

          # Start Cloudflare Quick Tunnel for Web access
          cloudflared tunnel --url http://localhost:6080 > /tmp/cloudflared.log 2>&1 &

          # Setup Tailscale via Homebrew CLI
          if [ -n "$TS_KEY" ]; then
            echo "==> Installing Tailscale for macOS via Homebrew..."
            brew install tailscale
            echo "==> Starting Tailscale daemon..."
            sudo brew services start tailscale
            sleep 4
            sudo tailscale up --authkey="$TS_KEY" --hostname="gha-macos-rdp" --accept-routes || echo "Warning: Tailscale auth failed. Check if key is valid."
          fi

          # Setup Ngrok (forward port 5900)
          if [ -n "$NGROK_TOKEN" ]; then
            echo "==> Installing Ngrok for macOS..."
            brew install ngrok/ngrok/ngrok 2>/dev/null || true
            ngrok config add-authtoken "$NGROK_TOKEN"
            ngrok tcp 5900 --log=stdout > /tmp/ngrok.log 2>&1 &
            sleep 3
          fi

      - name: Generate Connection Info & Step Summary
        run: |
          PASS="${{ github.event.inputs.vnc_password }}"
          
          # Extract Cloudflare URL if available
          CF_URL=""
          for i in {1..25}; do
            if [ -f /tmp/cloudflared.log ]; then
              CF_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]*\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
              if [ -n "$CF_URL" ]; then break; fi
            fi
            sleep 1
          done

          TS_IP=""
          if command -v tailscale >/dev/null 2>&1 && tailscale ip -4 >/dev/null 2>&1; then
            TS_IP=$(tailscale ip -4 || true)
          fi

          NGROK_HOST=""
          if [ -f /tmp/ngrok.log ]; then
            NGROK_HOST=$(grep -o 'tcp://[-a-zA-Z0-9.:]*' /tmp/ngrok.log | head -n 1 || true)
          fi

          OS_VERSION=$(sw_vers -productVersion)
          OS_NAME=$(sw_vers -productName)
          OPTIMIZED_WEB_URL="${CF_URL}/vnc.html?autoconnect=true&resize=scale&quality=6"

          echo "### 🍎 macOS Apple Silicon Desktop is LIVE!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "$CF_URL" ]; then
            echo "#### 🌐 1-Click Fast Web Browser Access (Zero Setup):" >> $GITHUB_STEP_SUMMARY
            echo "- **👉 [Click Here to Open macOS in Browser](${OPTIMIZED_WEB_URL})**" >> $GITHUB_STEP_SUMMARY
            echo "- **Password:** \`${PASS}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "#### 💻 System & Credentials:" >> $GITHUB_STEP_SUMMARY
          echo "- **OS:** ${OS_NAME} ${OS_VERSION} (Apple Silicon)" >> $GITHUB_STEP_SUMMARY
          echo "- **Username:** \`rdpuser\` (or \`runner\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Password:** \`${PASS}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -n "$TS_IP" ]; then
            echo "#### 🍏 Native Apple Screen Sharing via Tailscale:" >> $GITHUB_STEP_SUMMARY
            echo "- **Mac Screen Sharing Address:** \`vnc://${TS_IP}:5900\` (or \`vnc://gha-macos-rdp:5900\`)" >> $GITHUB_STEP_SUMMARY
            echo "- **How to connect:** Open Terminal on your Mac and run: \`open vnc://${TS_IP}:5900\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Login:** Username \`rdpuser\`, Password \`${PASS}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$NGROK_HOST" ]; then
            echo "#### 🔌 Ngrok Public VNC:" >> $GITHUB_STEP_SUMMARY
            echo "- **VNC Address:** \`${NGROK_HOST#tcp://}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "========================================================"
          if [ -n "$CF_URL" ]; then echo ">>> 1-CLICK WEB DESKTOP: ${OPTIMIZED_WEB_URL}"; fi
          echo ">>> USERNAME: rdpuser (or runner)"
          echo ">>> PASSWORD: ${PASS}"
          if [ -n "$TS_IP" ]; then echo ">>> NATIVE SCREEN SHARING: vnc://${TS_IP}:5900"; fi
          if [ -n "$NGROK_HOST" ]; then echo ">>> NGROK VNC: ${NGROK_HOST#tcp://}"; fi
          echo "========================================================"

      - name: Keep macOS Runner Alive
        run: |
          HOURS="${{ github.event.inputs.session_hours }}"
          SECONDS_TOTAL=$(awk "BEGIN {print int($HOURS * 3600)}")
          
          if [ $SECONDS_TOTAL -gt 20800 ]; then
            SECONDS_TOTAL=20800
          fi

          echo "==> macOS session active for $HOURS hours ($SECONDS_TOTAL seconds)."
          echo "==> To terminate early, click 'Cancel workflow' in GitHub Actions."

          START_TIME=$(date +%s)
          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            REMAINING=$((SECONDS_TOTAL - ELAPSED))
            
            if [ $REMAINING -le 0 ]; then
              echo "==> Time limit reached. Shutting down gracefully."
              break
            fi

            MINS_LEFT=$((REMAINING / 60))
            echo "[$MINS_LEFT min remaining] macOS session is running..."
            sleep 300
          done

      - name: Tailscale Auto-Cleanup & Machine Removal
        if: always()
        run: |
          if command -v tailscale >/dev/null 2>&1; then
            echo "==> Automatically logging out and removing macOS runner from Tailscale..."
            sudo tailscale logout || true
          fi
